{% load static %}
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pet Care Tracker{% endblock %} | Pet Care Tracker</title>

    <link rel="preload" href="{% static 'fonts/forum-cyrillic-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">

    {% include 'common/partials/navbar.html' %}

    <main class="flex-grow-1 py-5">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% include 'common/partials/footer.html' %}

    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
